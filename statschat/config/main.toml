[db]
faiss_db_root = "data/db_langchain"
embedding_model_name = "sentence-transformers/all-mpnet-base-v2" #all-mpnet-base-v2" #all-MiniLM-L6-v2" #"sentence-transformers/all-mpnet-base-v2"  # "textembedding-gecko@001" "sentence-transformers/paraphrase-MiniLM-L3-v2"

[preprocess]
mode = "UPDATE" # "SETUP" or "UPDATE"
data_dir = "data/"
download_dir = "pdf_downloads"
directory = "json_conversions"
split_directory = "json_split"
split_length = 2000
split_overlap = 200
latest_only = false

[search]
generative_model_name = "mistralai/mistral-small-3.1-24b-instruct:free"  # Free OpenRouter default for experimentation; may be rate-limited. Consider "mistralai/mistral-nemo" as a low-cost paid upgrade later.
k_docs = 2
k_contexts = 5
similarity_threshold = 2.0     # Threshold score below which a document is returned in a search
llm_temperature = 0.0
llm_max_tokens = 1024
answer_threshold = 0.5 # Threshold score below which a answer is returned in a search
document_threshold = 0.9 # Threshold score below which a document is returned in a search
provider = "openrouter"  # or "openai", "huggingface_inference"

[app]
latest_max = 2    # Takes value int >= 0, commonly 0, 1 or 2
page_start = 1    # Sets where to start looking for downloads. Higher the number the older the publications.
page_end = 5      # Sets where to stop looking for downloads. Higher the number the older the publications
